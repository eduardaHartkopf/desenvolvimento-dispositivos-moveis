name: lista_compras
description: "Lista de Compras - codigo base para a aula de SQLite (IFSC Campus Cacador)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  carousel_slider: ^5.1.2 # Carrossel com troca automática e controle manual.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets: # Registra as imagens utilizadas pelo aplicativo.
    - assets/images/logo_vibra.png # Logo exibida na barra superior.
    - assets/images/banner_eletro_music.png # Primeiro banner.
    - assets/images/banner_festival_neon.png # Segundo banner.
    - assets/images/banner_electronic_fest.png # Terceiro banner.
    - assets/images/evento_lana_del_rey.png # Foto do primeiro card.
    - assets/images/evento_pop_tropical.png # Foto do segundo card.
    - assets/images/evento_future_nostalgia.png # Foto do terceiro card.
